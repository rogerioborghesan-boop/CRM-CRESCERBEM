<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pizzip@3/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3/build/docxtemplater.js"></script>
<style>
:root{--cor:#2d5238;--cor2:#eaf3ec;--cor3:#1f3d29;--lar:#f28b30;--verde:#228b3b;--tx:#1f2937;--mut:#6b7280;--bd:#e5e7eb;--bg:#f6f7f6;--card:#fff;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);font-size:15px}
a{color:var(--cor)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--cor);color:#fff;font-weight:600}
.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:#dc2626}
.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:#fff;color:var(--tx)}
textarea{min-height:70px;resize:vertical}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
#app{display:flex;height:100%}
#side{width:240px;background:#fff;border-right:1px solid var(--bd);overflow:auto;flex-shrink:0;padding:10px 8px 40px}
#side .logo{display:flex;align-items:center;gap:8px;padding:6px 8px 14px;font-weight:800;color:var(--cor3);font-size:18px}
#side .logo img{max-height:38px;max-width:150px}
#side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:14px 10px 4px}
#side a.it{display:block;padding:7px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px}
#side a.it:hover{background:var(--cor2)}
#side a.it.on{background:var(--cor);color:#fff;box-shadow:inset 4px 0 0 var(--lar)}
#wrap{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:52px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 14px}
#top .tt{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBt{display:none;background:none;border:0;font-size:22px}
#net{font-size:12px;padding:3px 8px;border-radius:20px;background:#dcfce7;color:#166534}
#net.off{background:#fee2e2;color:#991b1b}
#main{flex:1;overflow:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:140px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar>input,.bar>select{width:auto;flex:1;min-width:150px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px;vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;background:#fafafa;position:sticky;top:0}
tr.cl:hover td{background:var(--cor2);cursor:pointer}
.tbl{overflow:auto;border:1px solid var(--bd);border-radius:var(--r);max-height:calc(100vh - 190px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 12px}
.grid .full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:22px;color:var(--cor3)}
.kpi span{font-size:12px;color:var(--mut)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#f1f5f9;color:#334155;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:12px;overflow:auto}
.tabs a{padding:8px 12px;text-decoration:none;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs a.on{color:var(--cor);border-color:var(--lar);font-weight:600}
.kan{display:flex;gap:10px;overflow:auto;padding-bottom:10px;height:calc(100vh - 175px)}
.col{min-width:250px;width:250px;background:#eef1ee;border-radius:var(--r);display:flex;flex-direction:column}
.col h4{margin:0;padding:10px;font-size:13px;display:flex;justify-content:space-between;gap:6px;border-top:4px solid #999;border-radius:var(--r) var(--r) 0 0}
.col .cards{flex:1;overflow:auto;padding:0 8px 8px}
.col.over{outline:2px dashed var(--cor)}
.kc{background:#fff;border-radius:10px;padding:9px;margin-bottom:7px;border:1px solid var(--bd);cursor:grab;font-size:13px}
.kc b{display:block;font-size:14px}
.kc .old{color:#b91c1c}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:2000;overflow:auto;padding:30px 10px}
#modal{background:#fff;border-radius:16px;width:100%;max-width:760px;padding:18px}
#modal h3{margin:0 0 12px}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:3000;max-width:90%}
#toast.err{background:#b91c1c}
.login{align-self:flex-start;width:100%;max-width:380px;margin:8vh auto;background:#fff;padding:26px;border-radius:16px;border:1px solid var(--bd)}
.login h2{margin:0 0 4px;color:var(--cor3)}
.login .grid{grid-template-columns:1fr}
.fotos img{width:90px;height:90px;object-fit:cover;border-radius:8px;margin:3px}
.rep{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px}
.rep table td{padding:3px}
.rep input{padding:6px}
#mapa{height:calc(100vh - 170px);border-radius:var(--r);border:1px solid var(--bd)}
.dia{border-left:4px solid var(--cor);padding-left:10px;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:6px}
.chk input{width:auto}
@media(max-width:860px){
 #side{position:fixed;z-index:1500;height:100%;left:-260px;transition:.2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
 #side.open{left:0}
 #menuBt{display:block}
 #main{padding:10px}
 .tbl{max-height:none}
 .hide-m{display:none}
}
@media print{#side,#top,.bar,.noprint{display:none!important}#main{overflow:visible}}
</style>
</head>

const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null||v===''?'':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>v==null||v===''?'':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2});

const dth=d=>d?new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'';
const hoje=()=>new Date().toLocaleDateString('sv-SE');
const mesIni=(d=new Date())=>new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('sv-SE');
const mesFim=(d=new Date())=>new Date(d.getFullYear(),d.getMonth()+1,0).toLocaleDateString('sv-SE');
const diasDesde=d=>d?Math.floor((Date.now()-new Date(d))/864e5):0;

function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',err?6000:2500)}
async function q(p){const {data,error,count}=await p;if(error){toast(traduz(error.message),1);throw error}return count!=null&&data==null?count:data}
function traduz(m){if(/row-level security/i.test(m))return 'Sem permissão para esta ação.';if(/Failed to fetch/i.test(m))return 'Sem conexão com o servidor.';return m}
async function todos(fab){let out=[],i=0;for(;;){const d=await q(fab().range(i,i+999));out=out.concat(d);if(d.length<1000)break;i+=1000}return out}

async function carregaRef(forcar){
  const cache=JSON.parse(localStorage.getItem('cb_ref')||'null');
  if(cache&&!forcar&&!navigator.onLine){REF=cache;return}
  try{
    const [cidades,bancos,agencias,servicos,funis,etapas,usuarios,config,uc,adm,planos,veiculos,taxas]=await Promise.all([
      todos(()=>sb.from('cidades').select('*').order('nome')),q(sb.from('bancos').select('*').order('ordem')),q(sb.from('agencias').select('*')),
      q(sb.from('servicos').select('*').order('ordem')),q(sb.from('funis').select('*').order('ordem')),q(sb.from('funil_etapas').select('*').order('ordem')),
      q(sb.from('usuarios').select('id,nome,email,telefone,cargo,perfil,ativo,unidade_id').order('nome')),q(sb.from('config').select('*')),
      q(sb.from('usuario_cidades').select('*')),q(sb.from('consorcio_administradoras').select('*').order('nome')),q(sb.from('consorcio_planos').select('*')),
      q(sb.from('veiculos').select('*').order('placa')),q(sb.from('taxas_credito').select('*').eq('ativo',true).order('programa').order('id'))]);
    REF={cidades,bancos,agencias,servicos,funis,etapas,usuarios,config,uc,adm,planos,veiculos,taxas,em:new Date().toISOString()};
    localStorage.setItem('cb_ref',JSON.stringify(REF));
  }catch(e){if(cache)REF=cache;else throw e}
}

const funil=chave=>REF.funis.find(f=>f.chave==chave);
function opts(ref){

// campo: {k, l, t: text|num|money|pct|date|time|sel|area|bool|cli|email|tel, o: ref, full, req, ro}
function campoHTML(f,v){
  const val=v??'';const id='f_'+f.k;const req=f.req?' required':'';const ro=f.ro?' disabled':'';
  let inp;
  switch(f.t){
    case 'sel':inp=`<select id="${id}" data-k="${f.k}"${req}${ro}><option value=""></option>${opts(f.o).map(o=>`<option value="${esc(o.v)}"${o.v==val?' selected':''}>${esc(o.t)}</option>`).join('')}</select>`;break;
    case 'area':inp=`<textarea id="${id}" data-k="${f.k}"${ro}>${esc(val)}</textarea>`;break;
    case 'bool':return `<div class="chk${f.full?' full':''}"><input type="checkbox" id="${id}" data-k="${f.k}"${val?' checked':''}${ro}><label for="${id}" style="margin:0;font-size:14px;color:var(--tx)">${esc(f.l)}</label></div>`;
    case 'cli':inp=`<input id="${id}" data-k="${f.k}" data-cli="${esc(val)}" list="dl_${f.k}" placeholder="Digite o nome do cliente" value="${esc(f.txt||'')}"${req}${ro} autocomplete="off"><datalist id="dl_${f.k}"></datalist>`;break;
    default:{const tp={num:'number',money:'number',pct:'number',date:'date',time:'time',email:'email',tel:'tel'}[f.t]||'text';
      inp=`<input id="${id}" data-k="${f.k}" type="${tp}"${tp=='number'?' step="any"':''} value="${esc(val)}"${req}${ro}${f.ph?` placeholder="${esc(f.ph)}"`:''}>`}
  }
  return `<div class="${f.full||f.t=='area'?'full':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inp}</div>`;
}
const formHTML=(fs,v={})=>`<div class="grid">${fs.map(f=>f.sec?`<div class="full" style="font-weight:700;margin-top:8px;color:var(--cor3)">${esc(f.sec)}</div>`:campoHTML(f,v[f.k])).join('')}</div>`;
function leForm(root,fs){
  const o={};for(const f of fs){if(f.sec||f.ro)continue;const el=$('#f_'+f.k,root);if(!el)continue;
    if(f.t=='bool')o[f.k]=el.checked;
    else if(f.t=='cli')o[f.k]=el.dataset.cli?Number(el.dataset.cli):null;
    else if(['num','money','pct'].includes(f.t))o[f.k]=el.value===''?null:Number(el.value);
    else o[f.k]=el.value===''?null:el.value;
    if(f.req&&(o[f.k]==null||o[f.k]==='')){toast('Preencha: '+f.l,1);el.focus();throw new Error('req')}}
  return o;
}
function ligaClientes(root){
  $$('input[data-cli]',root).forEach(inp=>{
    let tm;inp.addEventListener('input',()=>{
      const m=inp.value.match(/#(\d+)$/);if(m){inp.dataset.cli=m[1];inp.dispatchEvent(new Event('cliente'));return}
      inp.dataset.cli='';clearTimeout(tm);tm=setTimeout(async()=>{
        if(inp.value.length<2)return;
        const d=await q(sb.from('clientes').select('id,nome,cidade_id').ilike('nome','%'+inp.value+'%').order('nome').limit(25));

}

const fila=()=>JSON.parse(localStorage.getItem('cb_fila')||'[]');
async function gravaOuFila(tabela,obj){
  if(navigator.onLine){try{return await q(sb.from(tabela).insert(obj).select().single())}catch(e){if(!/conexão|fetch/i.test(e.message||''))throw e}}
  const f=fila();f.push({tabela,obj,em:new Date().toISOString()});localStorage.setItem('cb_fila',JSON.stringify(f));
  toast('Sem internet: salvo no aparelho, envia sozinho quando voltar o sinal.');return null;
}
async function enviaFila(){
  let f=fila();if(!f.length||!navigator.onLine)return;const resto=[];
  for(const it of f){const {error}=await sb.from(it.tabela).insert(it.obj);if(error)resto.push({...it,erro:error.message})}
  localStorage.setItem('cb_fila',JSON.stringify(resto));
  await sb.from('sync_log').insert({fonte:'fila do aparelho',ok:!resto.length,mensagem:`${f.length-resto.length} enviados, ${resto.length} com erro`});
  if(f.length-resto.length)toast(`${f.length-resto.length} registro(s) offline enviados.`);
}

function camposOperacao(funilChave){
  const base=[{k:'servico_id',l:'Tipo de serviço',t:'sel',o:'servicos',req:1},{k:'descricao',l:'Descrição (ex.: Projeto Trator, Milho)',req:1},
   {k:'etapa_id',l:'Etapa',t:'sel',o:REF.etapas.filter(e=>!funilChave||e.funil_id==funil(funilChave)?.id).map(e=>({v:e.id,t:(funilChave?'':nomeDe('funis',e.funil_id).split(' ')[0]+' · ')+e.nome}))},
   {k:'responsavel_id',l:'Responsável (campo)',t:'sel',o:'usuarios'},{k:'elaborador_id',l:'Elaborador',t:'sel',o:'usuarios'},
   {k:'banco_id',l:'Banco',t:'sel',o:'bancos'},{k:'agencia_id',l:'Agência',t:'sel',o:'agencias'}];
  const cred=[{k:'taxa_mcr_id',l:'Linha de crédito (MCR)',t:'sel',o:(REF.taxas||[]).map(x=>({v:x.id,t:x.programa+' · '+x.linha})),full:1},{k:'linha_credito',l:'Linha como o banco enquadrou'},{k:'programa',l:'Programa',t:'sel',o:['PRONAF','PRONAMP','Demais produtores','Consórcio','Outro']},
   {k:'taxa_aa',l:'Taxa contratada (% a.a.)',t:'pct'},{k:'prazo',l:'Prazo'},{k:'carencia',l:'Carência'},
   {k:'safra',l:'Safra',ph:'2026/27'},{k:'cultura',l:'Cultura / atividade'},{k:'area_ha',l:'Área (ha)',t:'num'},{k:'valor',l:'Valor do projeto (R$)',t:'money'},
   {k:'numero_proposta',l:'Nº da proposta'},{k:'numero_contrato',l:'Nº do contrato / cédula'},{k:'data_inicio',l:'Início',t:'date'},{k:'data_envio',l:'Enviado ao banco',t:'date'},
   {k:'data_liberacao',l:'Liberação',t:'date'},{k:'valor_liberado',l:'Valor liberado (R$)',t:'money'},{k:'data_vencimento',l:'Vencimento / prazo',t:'date'},
   {k:'honorario_pct',l:'Honorário (%)',t:'pct'},{k:'honorario_valor',l:'Honorário (R$)',t:'money'},{k:'honorario_pago',l:'Honorário recebido',t:'bool'},{k:'honorario_pago_em',l:'Recebido em',t:'date'},
   {k:'pendencias',l:'Pendências / documentos faltando',t:'area'},{k:'motivo_perda',l:'Motivo (se perdido)'},{k:'pasta_drive',l:'Link da pasta',full:1},{k:'obs',l:'Observações',t:'area'}];
  return base.concat(cred);
}
async function abreOperacao(id,depois,pre={},cli){
  let o=pre;if(id)o=await q(sb.from('operacoes').select('*,clientes(nome,telefone)').eq('id',id).single());
  const fs=camposOperacao();const hist=id?await q(sb.from('operacao_historico').select('*').eq('operacao_id',id).order('em',{ascending:false})):[];
  const nomeCli=o.clientes?.nome||cli?.nome||'';
  const extra=id?`<div style="margin-top:14px" class="mut"><b>Pasta:</b> ${esc(o.codigo)} - ${esc(o.descricao||'')} · <a href="#/cliente/${o.cliente_id}" onclick="fechaModal()">abrir cliente</a></div>
    <div style="margin-top:10px"><b style="font-size:13px">Histórico</b>${hist.map(h=>`<div class="mut">${dth(h.em)} · ${esc(etapa(h.etapa_de).nome||'início')} → <b>${esc(etapa(h.etapa_para).nome||'')}</b> · ${esc(nomeDe('usuarios',h.por))}</div>`).join('')||'<div class="mut">sem mudanças de etapa</div>'}</div>`:'';
  const m=modal((id?o.codigo+' · ':'Nova operação · ')+nomeCli,formHTML(fs,o)+extra,[{t:'Salvar',fn:async m=>{const d=leForm(m,fs);
    if(!d.honorario_valor&&d.honorario_pct&&(d.valor_liberado||d.valor))d.honorario_valor=Math.round((d.valor_liberado||d.valor)*d.honorario_pct)/100;
    if(id)await q(sb.from('operacoes').update(d).eq('id',id));else{d.cliente_id=o.cliente_id;if(d.etapa_id&&etapa(d.etapa_id).funil_id)d.funil_id=etapa(d.etapa_id).funil_id;const n=await q(sb.from('operacoes').insert(d).select().single());toast('Criada: '+n.codigo+' — use este nome na pasta')}
    toast('Salvo');depois&&depois()}},...(id?[{t:'📄 Gerar documento',cls:'sec',fn:()=>{setTimeout(()=>gerarDocumentos(o.cliente_id,id),50)}}]:[]),...(id&&ehGestor()?[{t:'Excluir',cls:'red',fn:async()=>{if(!confirm('Excluir esta operação?'))return false;await q(sb.from('operacoes').delete().eq('id',id));depois&&depois()}}]:[])]);
  const dicaMCR=(preenche)=>{const t=(REF.taxas||[]).find(x=>x.id==$('#f_taxa_mcr_id',m).value);let d=$('#dicaMCR',m);
    if(!d){d=document.createElement('div');d.id='dicaMCR';d.className='full mut';d.style.cssText='background:#fff7ed;border-radius:8px;padding:6px 10px';$('#f_taxa_mcr_id',m).parentNode.after(d)}
    if(!t){d.style.display='none';return}d.style.display='block';
    d.innerHTML=`MCR indica: <b>${t.taxa_aa!=null?num(t.taxa_aa)+'% a.a.':'taxa a conferir'}</b> · prazo ${esc(t.prazo||'—')} · carência ${esc(t.carencia||'—')}${t.limite?' · limite '+money(t.limite):''}${t.obs?' · '+esc(t.obs):''}. Se o banco enquadrar diferente, altere os campos abaixo.`;
    if(preenche){if(!$('#f_taxa_aa',m).value&&t.taxa_aa!=null)$('#f_taxa_aa',m).value=t.taxa_aa;if(!$('#f_prazo',m).value)$('#f_prazo',m).value=t.prazo||'';if(!$('#f_carencia',m).value)$('#f_carencia',m).value=t.carencia||'';
      if(!$('#f_linha_credito',m).value)$('#f_linha_credito',m).value=t.linha;const pg={PRONAF:'PRONAF',PRONAMP:'PRONAMP','Demais produtores':'Demais produtores'}[t.programa];if(pg&&!$('#f_programa',m).value)$('#f_programa',m).value=pg}};
  $('#f_taxa_mcr_id',m).onchange=()=>dicaMCR(true);dicaMCR(false);
  // ao trocar serviço numa operação nova, sugere a 1ª etapa do funil dele
  if(!id)$('#f_servico_id',m).onchange=e=>{const s=REF.servicos.find(s=>s.id==e.target.value);const et=REF.etapas.filter(x=>x.funil_id==s?.funil_id&&x.ativo).sort((a,b)=>a.ordem-b.ordem)[0];if(et)$('#f_etapa_id',m).value=et.id};
}

// ---------- PIPELINE (kanban) ----------
async function kanban({el,etapas,itens,etapaDe,card,mover,abrir}){
  el.innerHTML=`<div class="kan">${etapas.map(e=>{const its=itens.filter(i=>etapaDe(i)==e.id);return `<div class="col" data-e="${e.id}"><h4 style="border-top-color:${e.cor||'#999'}"><span>${esc(e.codigo?e.codigo+' ':'')}${esc(e.nome)}</span><span class="tag">${its.length}</span></h4><div class="cards">${its.map(i=>`<div class="kc" draggable="true" data-id="${i.id}">${card(i)}</div>`).join('')}</div></div>`}).join('')}</div>`;
  let arr=null;
  $$('.kc',el).forEach(c=>{c.ondragstart=()=>arr=c.dataset.id;c.onclick=()=>abrir(c.dataset.id)});
  $$('.col',el).forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=async e=>{e.preventDefault();col.classList.remove('over');if(arr){await mover(arr,Number(col.dataset.e));arr=null}}});
}
TELAS.pipeline=async(chave='credito')=>{
  const fs=REF.funis.filter(f=>f.ativo&&f.chave!='prevenda');const f=funil(chave)||fs[0];
  const M=$('#main');
  M.innerHTML=`<div class="tabs">${fs.map(x=>`<a href="#/pipeline/${x.chave}" class="${x.id==f.id?'on':''}">${esc(x.nome)}</a>`).join('')}</div>
   <div class="bar"><input id="b" placeholder="Filtrar cliente / código…"><select id="fr"><option value="">Todos responsáveis</option>${opts('usuarios').map(o=>`<option value="${o.v}">${esc(o.t)}</option>`).join('')}</select>
   <select id="fb"><option value="">Todos os bancos</option>${opts('bancos').map(o=>`<option value="${o.v}">${esc(o.t)}</option>`).join('')}</select><span class="mut" id="tot"></span></div><div id="kb"></div>`;
  const ets=REF.etapas.filter(e=>e.funil_id==f.id&&e.ativo).sort((a,b)=>a.ordem-b.ordem);
  let ops=[];
  const carrega=async()=>{const corte=new Date(Date.now()-90*864e5).toISOString();
    ops=await todos(()=>sb.from('operacoes').select('id,codigo,descricao,valor,banco_id,linha_credito,etapa_id,etapa_em,responsavel_id,pendencias,situacao,clientes(nome,cidade_id)').eq('funil_id',f.id).or(`situacao.eq.andamento,etapa_em.gte.${corte}`));desenha()};
  const desenha=()=>{const b=$('#b').value.toLowerCase(),r=$('#fr').value,bc=$('#fb').value;
    const it=ops.filter(o=>(!b||(o.clientes?.nome+' '+o.codigo).toLowerCase().includes(b))&&(!r||o.responsavel_id==r)&&(!bc||o.banco_id==bc));
    const and=it.filter(o=>o.situacao=='andamento');$('#tot').textContent=`${and.length} em andamento · ${money(and.reduce((s,o)=>s+(+o.valor||0),0))}`;
    kanban({el:$('#kb'),etapas:ets,itens:it,etapaDe:o=>o.etapa_id,
      card:o=>{const d=diasDesde(o.etapa_em);return `<b>${esc(o.clientes?.nome)}</b><div class="mut">${esc(o.codigo)} ${esc(o.descricao||'')}</div><div>${money(o.valor)} ${o.banco_id?'<span class="tag">'+esc(nomeDe('bancos',o.banco_id,'sigla'))+'</span>':''}</div><div class="mut">${esc(nomeDe('cidades',o.clientes?.cidade_id))} · <span class="${d>15&&o.situacao=='andamento'?'old':''}">${d}d na etapa</span></div>${o.pendencias?`<div class="mut" style="color:#b45309">⚠ ${esc(o.pendencias.slice(0,60))}</div>`:''}`},
      mover:async(id,e)=>{await q(sb.from('operacoes').update({etapa_id:e}).eq('id',id));const o=ops.find(x=>x.id==id);o.etapa_id=e;o.etapa_em=new Date().toISOString();const esp=etapa(e).especial;o.situacao=esp=='perdido'?'perdido':esp?'arquivo':'andamento';desenha();toast('Movido para '+etapa(e).nome)},
      abrir:id=>abreOperacao(id,carrega)})};
  $('#b').oninput=desenha;$('#fr').onchange=desenha;$('#fb').onchange=desenha;await carrega();
};

TELAS.painel=async()=>{

    todos(()=>sb.from('operacoes').select('id,funil_id,etapa_id,valor,etapa_em,responsavel_id').eq('situacao','andamento')),
    todos(()=>sb.from('operacoes').select('id,valor_liberado,valor,honorario_valor,responsavel_id').gte('data_liberacao',ini).lte('data_liberacao',fim)),

   <div class="kpi"><b>${money(lib.reduce((s,o)=>s+(+o.valor_liberado||+o.valor||0),0))}</b><span>liberado no mês (${lib.length})</span></div><div class="kpi"><b>${money(soma(lib,'honorario_valor'))}</b><span>honorários do mês</span></div>
   <div class="kpi"><b>${vis.length}</b><span>visitas no mês</span></div><div class="kpi"><b>${novos}</b><span>clientes novos no mês</span></div><div class="kpi" style="cursor:pointer" onclick="location.hash='#/pipeline'"><b style="color:#b91c1c">${parados.length}</b><span>paradas há +15 dias</span></div></div>
   <div class="row" style="align-items:flex-start">${REF.funis.filter(f=>f.ativo&&f.chave!='prevenda').map(f=>{const ets=REF.etapas.filter(e=>e.funil_id==f.id&&e.ativo&&!e.especial).sort((a,b)=>a.ordem-b.ordem);const tot=ops.filter(o=>o.funil_id==f.id).length;if(!tot)return '';
     return `<div class="card" style="min-width:260px"><b><a href="#/pipeline/${f.chave}">${esc(f.nome)}</a></b>${ets.map(e=>{const l=ops.filter(o=>o.etapa_id==e.id);return `<div class="row" style="margin-top:6px"><span>${esc(e.nome)}</span><span style="text-align:right">${l.length} · ${money(soma(l,'valor'))}</span></div>`}).join('')}</div>`}).join('')||'<div class="card mut">Sem operações em andamento. Cadastre clientes e crie operações para ver o painel.</div>'}

};

 {k:'acao',l:'Assunto',t:'sel',o:['Prospecção','Coleta de documentos','Apresentação de proposta','Vistoria / laudo','Proagro','Consórcio','Entrega de contrato','Pós-venda','Cobrança de honorário','Outro']},

 {k:'descricao',l:'O que foi conversado',t:'area',req:1},{k:'proximo_passo',l:'Próximo passo',full:1},{k:'proxima_data',l:'Data do próximo passo',t:'date'},{k:'localizacao',l:'GPS'}];

const COLETA={
  proposta:[{k:'finalidade',l:'Finalidade',full:1},{k:'valor_total',l:'Valor total (R$)',t:'money'},{k:'banco_linha',l:'Banco e linha (ex.: BB - Mais Alimentos)'},{k:'carencia',l:'Carência (meses)',t:'num'},{k:'prazo',l:'Prazo máximo (anos)',t:'num'},
    {k:'forma_pagto',l:'Forma de pagamento'},{k:'distancia',l:'Distância do centro (km)'},{k:'gps',l:'GPS / CAR'}],
  uso:[{k:'ha_agricola',l:'Agrícola (ha)',t:'num'},{k:'ha_pastagem',l:'Pecuária / pastagem (ha)',t:'num'},{k:'ha_floresta',l:'Florestamento (ha)',t:'num'},{k:'ha_reserva',l:'Reserva natural (ha)',t:'num'},
    {k:'ha_aguas',l:'Águas e fontes (ha)',t:'num'},{k:'ha_outros',l:'Outros usos (ha)',t:'num'},{k:'ha_propria',l:'Área própria (ha)',t:'num'},{k:'ha_arrendada',l:'Área arrendada (ha)',t:'num'}],
  tabelas:{imoveis:['Matrícula','Área (ha)','Cartório','Próprio/arrendado'],agricola:['Produto','Área (ha)','Produtividade','Preço venda','Custo','Comercialização'],
    pecuaria:['Atividade','Cabeças / lote / kg','Sistema','Área (ha)'],infra:['Discriminação','Quant.','Área','Material','Idade','Valor'],
    maquinas:['Discriminação','Quant.','Modelo','Marca','Potência','Ano','Valor'],nao_agro:['Atividade','Especificação','Renda anual'],desimob:['Bem vendido','Valor'],avalistas:['Nome','CPF','Telefone']},
  nomes:{imoveis:'Imóveis (matrículas)',agricola:'Produção agrícola',pecuaria:'Produção pecuária',infra:'Infraestrutura disponível',maquinas:'Máquinas, veículos e equipamentos',nao_agro:'Receitas não agropecuárias',desimob:'Desimobilização patrimonial',avalistas:'Avalistas'}
};
TELAS.coleta=async(arg)=>{
  const M=$('#main');
  if(!arg){await crud({tabela:'coletas',select:'*,clientes(nome,cidade_id)',ordem:'criado_em',podeCriar:false,
    topo:`<div class="bar"><button class="btn" onclick="location.hash='#/coleta/novo'">+ Nova coleta de dados</button></div>`,
    cols:[{l:'Data',f:r=>dth(r.criado_em)},{l:'Cliente',f:r=>r.clientes?.nome},{l:'Cidade',f:r=>nomeDe('cidades',r.clientes?.cidade_id)},{l:'Tipo',k:'tipo'},{l:'Por',f:r=>nomeDe('usuarios',r.responsavel_id),m:1}],
    abrir:r=>location.hash='#/coleta/'+r.id});return}
  let reg={dados:{},tipo:'Investimento'},cliTxt='';
  if(arg.startsWith('novo')){const cid=arg.split('-')[1];if(cid){reg.cliente_id=+cid;const c=await q(sb.from('clientes').select('nome,cidade_id').eq('id',cid).single());cliTxt=`${c.nome} · ${nomeDe('cidades',c.cidade_id)} #${cid}`}}
  else{reg=await q(sb.from('coletas').select('*,clientes(nome,cidade_id)').eq('id',arg).single());cliTxt=`${reg.clientes.nome} · ${nomeDe('cidades',reg.clientes.cidade_id)} #${reg.cliente_id}`}
  const d=reg.dados||{};
  const repHTML=(k)=>{const cols=COLETA.tabelas[k];const rows=(d[k]&&d[k].length?d[k]:[[]]);
    return `<div class="rep" data-rep="${k}"><b style="font-size:13px">${COLETA.nomes[k]}</b><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map((c,i)=>`<td><input value="${esc(r[i]??'')}"></td>`).join('')}<td><button class="btn sec sm" data-del>×</button></td></tr>`).join('')}</tbody></table><button class="btn sec sm" data-add>+ linha</button></div>`};
  M.innerHTML=`<div class="card"><div class="grid">${campoHTML({k:'cliente_id',l:'Cliente',t:'cli',req:1,full:1,txt:cliTxt},reg.cliente_id)}${campoHTML({k:'tipo',l:'Tipo',t:'sel',o:['Investimento','Custeio','Proagro','Laudo','Consórcio','Outro']},reg.tipo)}</div></div>
   <div class="card"><b>1. Proposta</b>${formHTML(COLETA.proposta,d)}</div><div class="card"><b>2. Uso da terra</b>${formHTML(COLETA.uso,d)}</div>
   <div class="card">${Object.keys(COLETA.tabelas).map(repHTML).join('')}</div>
   <div class="card"><label>Diagnóstico da situação atual</label><textarea id="diag" style="min-height:120px">${esc(d.diagnostico||'')}</textarea></div>
   <div class="row noprint"><button class="btn sec" onclick="print()">🖨 Imprimir</button><button class="btn" id="sv">Salvar coleta</button></div>`;
  ligaClientes(M);if(reg.cliente_id)$('#f_cliente_id').dataset.cli=reg.cliente_id;
  M.onclick=e=>{if(e.target.dataset.add!=null){const tb=$('tbody',e.target.closest('.rep'));const tr=tb.rows[0].cloneNode(true);$$('input',tr).forEach(i=>i.value='');tb.appendChild(tr)}
    if(e.target.dataset.del!=null){const tb=e.target.closest('tbody');if(tb.rows.length>1)e.target.closest('tr').remove();else $$('input',e.target.closest('tr')).forEach(i=>i.value='')}};
  $('#sv').onclick=async()=>{const top=leForm(M,[{k:'cliente_id',l:'Cliente',t:'cli',req:1},{k:'tipo',t:'sel'}]);
    const dados={...leForm(M,COLETA.proposta),...leForm(M,COLETA.uso),diagnostico:$('#diag').value};
    $$('.rep',M).forEach(r=>dados[r.dataset.rep]=[...$$('tbody tr',r)].map(tr=>$$('input',tr).map(i=>i.value)).filter(l=>l.some(v=>v)));
    const o={...top,dados,mudou_em:new Date().toISOString()};
    if(reg.id)await q(sb.from('coletas').update(o).eq('id',reg.id));else await gravaOuFila('coletas',o);toast('Coleta salva');location.hash='#/coleta'};
};

// ---------- AGENDA ----------
const CAMPOS_AGENDA=[{k:'titulo',l:'O quê',req:1,full:1},{k:'data',l:'Data',t:'date',req:1},{k:'hora_ini',l:'Início',t:'time'},{k:'hora_fim',l:'Fim',t:'time'},
 {k:'tipo',l:'Tipo',t:'sel',o:['Visita','Retorno','Vistoria','Proagro','Reunião no banco','Entrega de contrato','Evento','Outro']},{k:'cliente_id',l:'Cliente',t:'cli',full:1},{k:'cidade_id',l:'Cidade',t:'sel',o:'cidades'},
 {k:'local',l:'Local'},{k:'status',l:'Status',t:'sel',o:['agendado','realizado','cancelado','remarcado']},{k:'obs',l:'Observações',t:'area'}];
function formAgenda(area,row={},depois){
  const novo=!row.id;const eq=row.equipe||[ME.id];
  const corpo=formHTML(CAMPOS_AGENDA.map(f=>f.k=='cliente_id'?{...f,txt:row.clientes?`${row.clientes.nome} #${row.cliente_id}`:''}:f),{data:hoje(),status:'agendado',...row})+
   `<div style="margin-top:10px"><label>Equipe</label><div class="row">${REF.usuarios.filter(u=>u.ativo).map(u=>`<label class="chk" style="flex:0 0 auto;font-size:14px;color:var(--tx)"><input type="checkbox" class="eq" value="${u.id}"${eq.includes(u.id)?' checked':''}> ${esc(u.nome)}</label>`).join('')}</div></div>`;
  modal(novo?'Nova agenda':'Agenda',corpo,[{t:'Salvar',fn:async m=>{const o=leForm(m,CAMPOS_AGENDA);if(!$('#f_cliente_id',m).value)o.cliente_id=null;o.equipe=$$('.eq:checked',m).map(c=>c.value);o.area=area;
    if(novo)await gravaOuFila('agenda_itens',o);else await q(sb.from('agenda_itens').update(o).eq('id',row.id));toast('Agenda salva');depois&&depois()}},
    ...(!novo?[{t:'Lançar visita',cls:'sec',fn:()=>{location.hash='#/visita/'+(row.cliente_id||'')}},{t:'Excluir',cls:'red',fn:async()=>{if(!confirm('Excluir?'))return false;await q(sb.from('agenda_itens').delete().eq('id',row.id));depois&&depois()}}]:[])]);
  if(row.cliente_id)$('#f_cliente_id').dataset.cli=row.cliente_id;
}
async function telaAgenda(area){
  const M=$('#main');
  M.innerHTML=`<div class="bar"><input type="date" id="di" value="${hoje()}"><select id="fp"><option value="7">7 dias</option><option value="30">30 dias</option><option value="-30">últimos 30 dias</option></select>
   <select id="fr"><option value="">Toda a equipe</option>${opts('usuarios').map(o=>`<option value="${o.v}"${o.v==ME.id?' selected':''}>${esc(o.t)}</option>`).join('')}</select><button class="btn" id="nv">+ Nova agenda</button></div><div id="la"></div>`;
  const carrega=async()=>{const p=+$('#fp').value;const a=new Date($('#di').value+'T12:00');const b=new Date(a.getTime()+p*864e5);const [i,f]=(p>0?[a,b]:[b,a]).map(x=>x.toLocaleDateString('sv-SE'));
    let qb=sb.from('agenda_itens').select('*,clientes(nome,telefone,cidade_id)').eq('area',area).gte('data',i).lte('data',f).order('data').order('hora_ini');if($('#fr').value)qb=qb.contains('equipe',[$('#fr').value]);
    const l=await q(qb);const dias=[...new Set(l.map(x=>x.data))];
    $('#la').innerHTML=dias.map(dd=>`<div class="dia"><b>${new Date(dd+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})}</b>${l.filter(x=>x.data==dd).map(x=>`<div class="card cl" style="cursor:pointer;margin:6px 0" data-id="${x.id}"><b>${x.hora_ini?.slice(0,5)||'--:--'}</b> ${esc(x.titulo)} <span class="tag">${esc(x.tipo||'')}</span> <span class="tag">${esc(x.status)}</span>
      <div class="mut">${x.clientes?esc(x.clientes.nome)+' · ':''}${esc(nomeDe('cidades',x.cidade_id||x.clientes?.cidade_id))} · ${(x.equipe||[]).map(u=>esc(nomeDe('usuarios',u).split(' ')[0])).join(', ')}</div></div>`).join('')}</div>`).join('')||'<p class="mut">Nada agendado no período.</p>';
    $$('[data-id]',$('#la')).forEach(c=>c.onclick=()=>formAgenda(area,l.find(x=>x.id==c.dataset.id),carrega))};
  ['#di','#fp','#fr'].forEach(s=>$(s).onchange=carrega);$('#nv').onclick=()=>formAgenda(area,{},carrega);await carrega();
}
TELAS.agenda=()=>telaAgenda('campo');TELAS.agendamkt=()=>telaAgenda('mkt');
TELAS.novaagenda=async()=>{await telaAgenda('campo');formAgenda('campo',{},()=>telaAgenda('campo'))};

// ---------- MAPA DE ATUAÇÃO ----------
TELAS.mapa=async()=>{
  const M=$('#main');const cores=['#2f7d32','#1565c0','#c62828','#6a1b9a','#ef6c00','#00838f','#ad1457','#4e342e','#558b2f','#283593'];
  const us=REF.usuarios.filter(u=>u.ativo);const corU=id=>cores[us.findIndex(u=>u.id==id)%cores.length]||'#999';
  M.innerHTML=`<div class="bar"><select id="fu"><option value="">Ver todos</option>${us.map(u=>`<option value="${u.id}">${esc(u.nome)}</option>`).join('')}</select><span class="mut">${ehGestor()?'Escolha uma pessoa e clique nas cidades para incluir/retirar da área dela.':'Bolinha = clientes na cidade; cor = responsável.'}</span></div><div id="mapa"></div>
   <div class="row mut" style="margin-top:6px">${us.map(u=>`<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${corU(u.id)}"></span> ${esc(u.nome)}</span>`).join('')}</div>`;
  const cli=await todos(()=>sb.from('clientes').select('cidade_id'));const nc={};cli.forEach(c=>nc[c.cidade_id]=(nc[c.cidade_id]||0)+1);
  let uc=await q(sb.from('usuario_cidades').select('*'));
  const map=L.map('mapa').setView([-27.2,-50.2],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  const layer=L.layerGroup().addTo(map);
  const desenha=()=>{layer.clearLayers();const fu=$('#fu').value;
    REF.cidades.filter(c=>c.lat).forEach(c=>{const donos=uc.filter(x=>x.cidade_id==c.id).map(x=>x.usuario_id);const n=nc[c.id]||0;
      const sel=fu&&donos.includes(fu);const cor=fu?(sel?corU(fu):'#bbb'):(donos[0]?corU(donos[0]):'#bbb');
      L.circleMarker([c.lat,c.lon],{radius:Math.max(4,Math.min(18,3+Math.sqrt(n)*2)),color:cor,fillColor:cor,fillOpacity:fu&&!sel?.15:.55,weight:sel?3:1}).addTo(layer)
       .bindTooltip(`<b>${esc(c.nome)}</b><br>${n} cliente(s)<br>${c.num_produtores?c.num_produtores+' estabelecimentos agro (IBGE)<br>':''}${donos.map(d=>esc(nomeDe('usuarios',d))).join(', ')||'sem responsável'}`)
       .on('click',async()=>{if(!ehGestor()||!fu)return;if(sel){await q(sb.from('usuario_cidades').delete().eq('usuario_id',fu).eq('cidade_id',c.id));uc=uc.filter(x=>!(x.usuario_id==fu&&x.cidade_id==c.id))}else{await q(sb.from('usuario_cidades').insert({usuario_id:fu,cidade_id:c.id}));uc.push({usuario_id:fu,cidade_id:c.id})}desenha()})})};
  $('#fu').onchange=desenha;desenha();setTimeout(()=>map.invalidateSize(),200);
};

TELAS.frota=async(tab='veiculos')=>{

  if(tab=='veiculos')return crud({tabela:'veiculos',ordem:'placa',asc:1,novo:'Veículo',ref:1,topo:t,
    campos:[{k:'placa',l:'Placa',req:1},{k:'modelo',l:'Modelo'},{k:'ano',l:'Ano',t:'num'},{k:'responsavel_id',l:'Responsável',t:'sel',o:'usuarios'},{k:'km_atual',l:'KM atual',t:'num'},{k:'km_proxima_revisao',l:'KM próxima revisão',t:'num'},{k:'seguradora',l:'Seguradora / contato'},{k:'ativo',l:'Ativo',t:'bool'},{k:'obs',l:'Observações',t:'area'}],
    padrao:()=>({ativo:true}),cols:[{l:'Placa',k:'placa'},{l:'Modelo',k:'modelo'},{l:'Responsável',f:r=>nomeDe('usuarios',r.responsavel_id)},{l:'KM',f:r=>num(r.km_atual)},{l:'Revisão',h:r=>r.km_proxima_revisao&&r.km_atual>=r.km_proxima_revisao-500?`<b style="color:#b91c1c">${num(r.km_proxima_revisao)}</b>`:num(r.km_proxima_revisao)}]});
  const campos=[{k:'veiculo_id',l:'Veículo',t:'sel',o:'veiculos',req:1},{k:'km',l:'KM atual',t:'num',req:1},{k:'tudo_ok',l:'Tudo OK com o veículo',t:'bool'},{k:'observacao',l:'Observações / problemas',t:'area'},{k:'aprovacao',l:'Avaliação (gestor)',t:'sel',o:['aprovada','reprovada']}];
  await crud({tabela:'vistorias_frota',ordem:'data_hora',novo:'Vistoria',podeCriar:true,topo:t,campos,podeEditar:r=>!r.id||ehGestor(),
    extra:r=>r.id?`<div class="fotos" id="vf"></div>`:`<div style="margin-top:10px"><label>Fotos: painel (KM), frente, traseira, laterais, pneus, interior</label><input type="file" id="ff" accept="image/*" multiple capture="environment"></div>`,
    antes:async(o,r)=>{if(!r.id){o.fotos=$('#ff').files.length?{lista:await sobeFotos($('#ff'),'frota')}:{};if(o.km)await sb.from('veiculos').update({km_atual:o.km}).eq('id',o.veiculo_id)}else if(o.aprovacao)o.avaliado_por=ME.id},
    cols:[{l:'Data',f:r=>dth(r.data_hora)},{l:'Veículo',f:r=>refTexto('veiculos',r.veiculo_id)},{l:'Motorista',f:r=>nomeDe('usuarios',r.motorista_id)},{l:'KM',f:r=>num(r.km)},{l:'OK',f:r=>r.tudo_ok?'✔':'⚠'},{l:'Avaliação',k:'aprovacao'}],
    abrir:(r,c)=>{edita({tabela:'vistorias_frota',campos,podeEditar:()=>ehGestor(),antes:async o=>{o.avaliado_por=ME.id},extra:()=>`<div class="fotos" id="vf"></div>`},r,c);mostraFotos($('#vf'),r.fotos?.lista)}});
};

TELAS.mercado=async(tab='clima')=>{
  const M=$('#main');const t=`<div class="tabs"><a href="#/mercado/clima" class="${tab=='clima'?'on':''}">Clima</a><a href="#/mercado/taxas" class="${tab=='taxas'?'on':''}">Taxas do crédito rural (MCR)</a><a href="#/mercado/precos" class="${tab=='precos'?'on':''}">Preços agrícolas</a></div>`;
  if(tab=='taxas')return crud({tabela:'taxas_credito',ordem:'programa',asc:1,novo:'Taxa',topo:t+`<p class="mut">Referência do MCR / Plano Safra 2026/27. Na operação, a linha escolhida sugere taxa, prazo e carência — a equipe pode alterar conforme o banco enquadrar. Conferir sempre no MCR: <a href="https://www3.bcb.gov.br/mcr" target="_blank">www3.bcb.gov.br/mcr</a></p>`,
    campos:[{k:'programa',l:'Programa',t:'sel',o:['PRONAF','PRONAMP','Demais produtores','BNDES','Outro'],req:1},{k:'linha',l:'Linha',req:1},{k:'finalidade',l:'Finalidade',t:'sel',o:['Custeio','Investimento','Comercialização','Industrialização']},{k:'taxa_aa',l:'Taxa (% a.a.)',t:'num'},{k:'limite',l:'Limite por beneficiário (R$)',t:'money'},{k:'prazo',l:'Prazo'},{k:'carencia',l:'Carência'},{k:'safra',l:'Safra',ph:'2026/27'},{k:'fonte',l:'Fonte (item do MCR)'},{k:'ativo',l:'Vigente',t:'bool'},{k:'obs',l:'Observações',t:'area'}],
    padrao:()=>({ativo:true,fonte:'MCR'}),cols:[{l:'Programa',k:'programa'},{l:'Linha',k:'linha'},{l:'Finalidade',k:'finalidade'},{l:'Taxa a.a.',f:r=>r.taxa_aa!=null?num(r.taxa_aa)+'%':''},{l:'Limite',f:r=>money(r.limite)},{l:'Prazo',k:'prazo',m:1},{l:'Safra',k:'safra',m:1}]});
  if(tab=='precos')return crud({tabela:'precos_diarios',ordem:'data',pk:'data',novo:'Preço',topo:t,
    campos:[{k:'data',l:'Data',t:'date',req:1},{k:'produto',l:'Produto',req:1},{k:'praca',l:'Praça',req:1},{k:'valor',l:'Valor (R$)',t:'money'},{k:'unidade',l:'Unidade',ph:'sc 60kg'},{k:'fonte',l:'Fonte',ph:'Epagri/Cepa, Cepea…'}],
    padrao:()=>({data:hoje()}),cols:[{l:'Data',f:r=>dt(r.data)},{l:'Produto',k:'produto'},{l:'Praça',k:'praca'},{l:'Valor',f:r=>money(r.valor)+' '+(r.unidade||'')},{l:'Fonte',k:'fonte',m:1}],
    abrir:()=>toast('Para corrigir, lance novamente com a mesma data, produto e praça.')});

TELAS.simulador=async()=>{
  const M=$('#main');
  const fs=[{sec:'Consórcio'},{k:'plano',l:'Plano cadastrado (opcional)',t:'sel',o:'planos',full:1},{k:'credito',l:'Valor do crédito (R$)',t:'money'},{k:'prazo',l:'Prazo (meses)',t:'num'},{k:'adm',l:'Taxa de administração total (%)',t:'pct'},{k:'fr',l:'Fundo de reserva (%)',t:'pct'},{k:'seg',l:'Seguro (% ao mês)',t:'pct'},{k:'le',l:'Lance embutido (%)',t:'pct'},{k:'lp',l:'Lance próprio (R$)',t:'money'},
   {sec:'Comparar com financiamento'},{k:'taxa',l:'Juros do financiamento (% a.a.)',t:'pct'},{k:'nparc',l:'Nº de parcelas',t:'num'},{k:'per',l:'Periodicidade',t:'sel',o:['anual','semestral','mensal']},{k:'car',l:'Carência (parcelas)',t:'num'}];
  M.innerHTML=`<div class="card" style="max-width:900px">${formHTML(fs,{credito:100000,prazo:100,adm:15,fr:2,seg:0,le:0,lp:0,taxa:8,nparc:7,per:'anual',car:1})}</div><div id="res"></div>`;
  const calc=()=>{const v=leForm(M,fs.filter(f=>!f.sec&&f.k!='plano'));const C=v.credito||0,n=v.prazo||1;const tt=(v.adm||0)+(v.fr||0);
    const totalCons=C*(1+tt/100);const seguroMes=totalCons*(v.seg||0)/100;const parcela=totalCons/n+seguroMes;const liq=C*(1-(v.le||0)/100);
    const saldoApos=Math.max(0,totalCons-(v.le||0)/100*C-(v.lp||0));const parcPosLance=saldoApos/n+seguroMes;
    const per={anual:1,semestral:2,mensal:12}[v.per]||1;const i=Math.pow(1+(v.taxa||0)/100,1/per)-1;const np=v.nparc||1,car=v.car||0;
    const pv=C*Math.pow(1+i,car);const pmt=i?pv*i/(1-Math.pow(1+i,-np)):pv/np;const totalFin=pmt*np;
    $('#res').innerHTML=`<div class="kpis"><div class="kpi"><b>${money(parcela)}</b><span>parcela do consórcio (${n}x)</span></div><div class="kpi"><b>${money(totalCons+seguroMes*n)}</b><span>total pago no consórcio</span></div>
     <div class="kpi"><b>${money(liq)}</b><span>crédito líquido (após lance embutido)</span></div><div class="kpi"><b>${money(parcPosLance)}</b><span>parcela estimada após lances</span></div>
     <div class="kpi"><b>${money(pmt)}</b><span>parcela financiamento (${np}x ${v.per})</span></div><div class="kpi"><b>${money(totalFin)}</b><span>total pago no financiamento</span></div>
     <div class="kpi"><b style="color:${totalFin>totalCons?'#16a34a':'#b91c1c'}">${money(Math.abs(totalFin-(totalCons+seguroMes*n)))}</b><span>${totalFin>totalCons+seguroMes*n?'consórcio sai mais barato':'financiamento sai mais barato'}</span></div></div>
     <p class="mut">Simulação estimativa: o consórcio depende de contemplação (sorteio ou lance); o financiamento segue as regras do MCR e a aprovação do banco. Valores sem correção do crédito (INCC/IPCA) nem IOF.</p><button class="btn sec noprint" onclick="print()">🖨 Imprimir para o cliente</button>`};
  M.oninput=calc;$('#f_plano').onchange=e=>{const p=REF.planos.find(x=>x.id==e.target.value);if(!p)return;[['prazo','prazo_meses'],['adm','taxa_adm_pct'],['fr','fundo_reserva_pct'],['seg','seguro_pct_mes'],['le','lance_embutido_pct']].forEach(([a,b])=>{if(p[b]!=null)$('#f_'+a).value=p[b]});calc()};calc();
};

function porExtenso(v){v=Math.round((+v||0)*100)/100;const un=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],ct=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const tri=n=>{if(!n)return '';if(n==100)return 'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(ct[c]);if(r<20){if(r)p.push(un[r])}else{p.push(dz[Math.floor(r/10)]+(r%10?' e '+un[r%10]:''))}return p.join(' e ')};
  const inteiro=Math.floor(v),cent=Math.round((v-inteiro)*100);const g=[[1e9,'bilhão','bilhões'],[1e6,'milhão','milhões'],[1e3,'mil','mil'],[1,'','']];let n=inteiro,ps=[];
  for(const [d,s1,s2] of g){const q=Math.floor(n/d);if(q){ps.push({v:q,t:d==1?tri(q):(d==1e3&&q==1?'mil':tri(q)+' '+(q==1?s1:s2))});n%=d}}
  let txt=ps.length?ps.map((x,i)=>i==0?x.t:((x.v<100||x.v%100==0)?' e ':' ')+x.t).join(''):'zero';
  txt+=inteiro==1?' real':(inteiro>=1e6&&inteiro%1e6==0?' de reais':' reais');
  if(cent)txt+=' e '+tri(cent)+(cent==1?' centavo':' centavos');return txt}

async function gerarDocumentos(cliId,opId){
  if(!MODELOS){try{MODELOS=await fetch(MODELOS_URL+'modelos.json').then(r=>r.json())}catch(e){return toast('Modelos indisponíveis (sem internet?)',1)}}
  const cli=await q(sb.from('clientes').select('*').eq('id',cliId).single());let ops=await q(sb.from('operacoes').select('*').eq('cliente_id',cliId).order('criado_em',{ascending:false}));
  const grupos=[...new Set(MODELOS.map(m=>m.grupo))];
  const m=modal('Gerar documento · '+cli.nome,`<div class="grid"><div class="full"><label>Operação (preenche banco, valor, linha…)</label><select id="dop"><option value="">— nenhuma —</option>${ops.map(o=>`<option value="${o.id}"${o.id==opId?' selected':''}>${esc(o.codigo+' '+(o.descricao||''))}</option>`).join('')}</select></div>
    <div class="full"><label>Modelo</label><input id="dbusca" placeholder="Buscar modelo…"><div id="dlista" style="max-height:340px;overflow:auto;margin-top:8px"></div></div></div>`,[]);
  const lista=()=>{const b=$('#dbusca',m).value.toLowerCase();$('#dlista',m).innerHTML=grupos.map(g=>{const its=MODELOS.filter(x=>x.grupo==g&&x.nome.toLowerCase().includes(b));return its.length?`<div class="grp" style="font-size:12px;color:var(--mut);margin:8px 0 4px;text-transform:uppercase">${esc(g)}</div>${its.map(x=>`<div class="kc" data-a="${x.arquivo}" style="cursor:pointer">📄 ${esc(x.nome)}</div>`).join('')}`:''}).join('')||'<p class="mut">Nenhum modelo.</p>';
    $$('[data-a]',m).forEach(el=>el.onclick=()=>preencher(MODELOS.find(x=>x.arquivo==el.dataset.a)))};
  $('#dbusca',m).oninput=lista;lista();
  const preencher=async mod=>{const op=ops.find(o=>o.id==$('#dop',m).value)||null;const base=await dadosBase(cli,op);const salvo=(op?.extras?.doc)||(cli.extras?.doc)||{};
    const val=k=>salvo[k]&&!/^(cliente_|conjuge|caf_|op_|cidade_data|data$)/.test(k)?salvo[k]:(base[k]??salvo[k]??'');
    const fs=mod.campos.filter(k=>!k.endsWith('_extenso')||['prazo_extenso','inicio_extenso','fim_extenso'].includes(k));
    const ordem=Object.keys(ROTULOS);fs.sort((a,b)=>(ordem.indexOf(a)+1||999)-(ordem.indexOf(b)+1||999));
    const porG={};['Cliente','Operação e banco','Outra parte / proprietário','Imóvel','Fornecedor','Contrato e outros'].forEach(g=>porG[g]=[]);fs.forEach(k=>porG[GRUPO_CAMPO(k)].push(k));Object.keys(porG).forEach(g=>{if(!porG[g].length)delete porG[g]});
    const corpo=`<p class="mut">Confira e complete. Campos em branco saem como "________" para preencher à mão.</p>`+Object.entries(porG).map(([g,ks])=>`<div style="font-weight:700;margin:10px 0 4px;color:var(--cor3)">${esc(g)}</div><div class="grid">${ks.map(k=>`<div class="${/endereco|descricao|cidade_data|empreendimento|brincos/.test(k)?'full':''}"><label>${esc(ROTULOS[k]||k.replace(/_/g,' '))}</label><input data-c="${k}" value="${esc(val(k))}"></div>`).join('')}</div>`).join('');
    modal(mod.nome,corpo,[{t:'Baixar Word preenchido',fn:async mm=>{const d={};$$('[data-c]',mm).forEach(i=>d[i.dataset.c]=i.value.trim());
      if(d.valor&&mod.campos.includes('valor_extenso')&&!d.valor_extenso){const n=+String(d.valor).replace(/[R$\s.]/g,'').replace(',','.');if(n){d.valor_extenso=porExtenso(n);d.valor=money(n)}}
      if(mod.campos.includes('op_valor_extenso'))d.op_valor_extenso=base.op_valor_extenso;
      const buf=await fetch(MODELOS_URL+mod.arquivo).then(r=>{if(!r.ok)throw new Error('modelo não encontrado');return r.arrayBuffer()});
      const doc=new window.docxtemplater(new PizZip(buf),{paragraphLoop:true,linebreaks:true,nullGetter:()=>'________'});
      const vazio={};mod.campos.forEach(k=>{vazio[k]=d[k]||''});Object.keys(vazio).forEach(k=>{if(!vazio[k])vazio[k]='________'});doc.render(vazio);
      const blob=doc.getZip().generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      const nome=`${op?.codigo?op.codigo+' - ':''}${mod.nome.replace(/[\\/:*?"<>|]/g,'-')} - ${cli.nome}.docx`;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();
      // guarda os dados da outra parte / imóvel para os próximos documentos desta operação
      const guardar={};Object.entries(d).forEach(([k,v])=>{if(v&&!/^(cliente_|conjuge|caf_|op_|cidade_data|data$|banco_nome|agencia)/.test(k))guardar[k]=v});
      if(op)await sb.from('operacoes').update({extras:{...(op.extras||{}),doc:{...(op.extras?.doc||{}),...guardar}}}).eq('id',op.id);else await sb.from('clientes').update({extras:{...(cli.extras||{}),doc:{...(cli.extras?.doc||{}),...guardar}}}).eq('id',cli.id);
      toast('Documento gerado: '+nome)}}]);
  };
}

// ===================== LOGIN =====================
function telaLogin(msg=''){
  $('#app').innerHTML=`<div class="login"><img src="${LOGO}" alt="Crescer Bem" style="width:100%;max-width:300px;display:block;margin:0 auto 10px"><p class="mut">CRM — crédito rural, laudos, Proagro e consórcios</p>${msg?`<div class="card" style="background:#fef3c7">${msg}</div>`:''}
   <div class="grid"><div><label>E-mail</label><input id="em" type="email" autocomplete="username"></div><div><label>Senha</label><input id="pw" type="password" autocomplete="current-password"></div>
   <div id="nmw" style="display:none"><label>Nome completo</label><input id="nm"></div></div>
   <div class="row" style="margin-top:14px"><button class="btn" id="ent">Entrar</button></div>
   <p class="mut" style="margin-top:14px"><a href="#" id="cri">Primeiro acesso? Criar conta</a> · <a href="#" id="esq">Esqueci a senha</a></p></div>`;
  let criando=false;
  $('#cri').onclick=e=>{e.preventDefault();criando=!criando;$('#nmw').style.display=criando?'block':'none';$('#ent').textContent=criando?'Criar conta':'Entrar'};
  $('#esq').onclick=async e=>{e.preventDefault();const em=$('#em').value;if(!em)return toast('Digite seu e-mail',1);await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});toast('Enviamos um link para seu e-mail')};
  const ent=async()=>{const email=$('#em').value.trim(),password=$('#pw').value;
    if(criando){if(!$('#nm').value)return toast('Informe seu nome',1);const {error}=await sb.auth.signUp({email,password,options:{data:{nome:$('#nm').value},emailRedirectTo:location.href.split('#')[0]}});
      if(error)return toast(traduz(error.message),1);return telaLogin('Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre. O gestor precisa liberar seu acesso.')}
    const {error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(/Invalid/.test(error.message)?'E-mail ou senha incorretos':/confirm/i.test(error.message)?'Confirme seu e-mail pelo link recebido':error.message,1);inicia()};
  $('#ent').onclick=ent;$('#pw').onkeydown=e=>e.key=='Enter'&&ent();
}
async function inicia(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return telaLogin();
  if(location.hash.includes('type=recovery')){const nova=prompt('Digite a nova senha:');if(nova){await sb.auth.updateUser({password:nova});toast('Senha alterada')}location.hash=''}
  try{ME=await q(sb.from('usuarios').select('*').eq('id',session.user.id).single());localStorage.setItem('cb_me',JSON.stringify(ME))}catch(e){ME=JSON.parse(localStorage.getItem('cb_me')||'null');if(!ME)return telaLogin('Não foi possível carregar seu usuário.')}
  if(!ME.ativo)return telaLogin(`Olá ${esc(ME.nome)}! Seu acesso ainda não foi liberado pelo gestor. <a href="#" onclick="sb.auth.signOut().then(()=>location.reload())">Sair</a>`);
  await carregaRef();moldura();navega();enviaFila();
}
sb.auth.onAuthStateChange((ev)=>{if(ev=='SIGNED_OUT')telaLogin()});
inicia();
</script>
</body>
</html>
